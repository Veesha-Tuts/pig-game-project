<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig Game</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="index.css" />

    <!-- Java Script -->
    <script defer src="index.js"></script>
  </head>
  <body>
    <!-- Body Content -->
     <section id="game-main-container">
      <div id="player--1" class="player">
        <div class="player-details">
          <h1 class="player-name">Player 1</h1>
          
          <!-- Stats Content -->
          <div class="stats-content" id="stats--total">
            <p class="sub-title">Total</p>
            <h3 class="total">00</h3>
          </div>
          
          <!-- Stats Content -->
          <div class="stats-content" id="stats--current">
            <p class="sub-title">Current</p>
            <h3 class="total">00</h3>
          </div>
          
          
        </div>
      </div>
      <div id="player--2" class="player">
        <div class="player-details">
          <h1 class="player-name">Player 2</h1>
          
          <!-- Stats Content -->
          <div class="stats-content" id="stats--total">
            <p class="sub-title">Total</p>
            <h3 class="total">00</h3>
          </div>
          
          <!-- Stats Content -->
          <div class="stats-content" id="stats--current">
            <p class="sub-title">Current</p>
            <h3 class="total">00</h3>
          </div>
          
          
        </div>
      </div>
      <div id="game--menu" class="game-menu">
        <!-- Image of Dice -->
        <div id="dice--image" class="dice-image">
          <img src="./media/dice-6.png" alt="">
        </div>
        <!-- Game Controls -->
        <div id="controls--button" class="controls-button">
          <button type="button" id="roll--dice">Roll Dice</button>
          <button type="button" id="roll--dice">Hold Score</button>
          <button type="button" id="roll--dice">Reset Game</button>
        </div>
      </div>
      </section>
     </div>
  </body>
</html>
