<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pig Game</title>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="./public/home.css">
    <link rel="stylesheet" href="./public/controls.css">

    <!-- Java Script -->
    <script defer src="index.js"></script>
  </head>
  <body>

    <!-- CURRENT PLAYER DIVISION -->
     <div class="current-player" id="current--player">
     </div>

    <!-- Body Content -->
     <section id="game--main--container" class="game-main-container">
      <div id="player--1" class="player player-1">
        <div class="player-details">
          <h1 class="player-name">Player 1</h1>
          
          <!-- Stats Content -->
          <div class="stats-content" id="stats--total">
            <p class="sub-title">Total</p>
            <h3 class="total">00</h3>
          </div>
          
          <!-- Stats Content -->
          <div class="stats-content" id="stats--current">
            <p class="sub-title">Current</p>
            <h3 class="current">00</h3>
          </div>
          
          
        </div>
      </div>
      <div id="player--2" class="player player-2">
        <div class="player-details">
          <h1 class="player-name">Player 2</h1>
          
          <!-- Stats Content -->
          <div class="stats-content" id="stats--total">
            <p class="sub-title">Total</p>
            <h3 class="total">00</h3>
          </div>
          
          <!-- Stats Content -->
          <div class="stats-content" id="stats--current">
            <p class="sub-title">Current</p>
            <h3 class="current">00</h3>
          </div>

        </div>
      </div>
      <div id="game--menu" class="game-menu">
        <!-- Image of Dice -->
        <div id="dice--image" class="dice-image">
          <img src="./media/dice-6.png" alt="Dice Image" id="dice--image--element">
        </div>
        <!-- Game Controls -->
        <div id="controls--button" class="controls-button">
          <button type="button" id="roll--dice">Roll Dice</button>
          <button type="button" id="hold--score">Switch Play</button>
          <button type="button" id="reset--game">Reset Game</button>
        </div>
      </div>
      </section>
     </div>

     <div class="modal-winner" id="modal--winner">
       <div class="stars">
         <p class="star">
           ⭐
         </p>
         <p class="star">
           ⭐
         </p>
         <p class="star">
           ⭐
         </p>
       </div>
      <h2 class="headline-winner" id="headline--winner">You Won</h2>
      <div class="stats">
        <p class="stats-heads">No. of Moves</p>
        <p class="moves-count" id="moves--count">00</p>
        <p class="stats-heads">Final Score</p>
        <p class="final-score" id="final--score">00</p>
      </div>
      <div class="modal-controls">
        <button type="button">okay</button>
        <button type="button" class="restart-game">
          <img src="./media/icons/restart-game.svg" alt="restart game menu">
        </button>
      </div>
     </div>
  </body>
</html>
